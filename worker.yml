name: samadhan-worker
on:
  schedule:
    # UTC. Bajar IST 09:15-15:30 = 03:45-10:00 UTC, som-shukra. Dar 5 minute.
    - cron: "45-59/5 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
  workflow_dispatch: {}          # Actions tab madhun hatane 'Run workflow' (chachni sathi)

concurrency:
  group: samadhan-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # journal / cooldown run madhye sathavnyasathi (cache chi trick)
      - uses: actions/cache@v4
        with:
          path: worker_state.json
          key: worker-state-${{ github.run_id }}
          restore-keys: worker-state-
      - name: Worker (ekda)
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEX: NIFTY
          CAPITAL: "100000"
          RISK_PCT: "1"
          # LOT_SIZE: "65"     # broker war tapasun ukarun set kara
        run: python worker.py --once
